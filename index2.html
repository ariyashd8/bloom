<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom: Launch Day</title>
<meta name="description" content="A tiny pixel game about launching a flower. Grow it, wrap it, price it, launch it. By Ariya Shahid.">
<!-- LinkedIn / social preview: replace YOUR-USERNAME after you set up GitHub Pages -->
<meta property="og:title" content="Bloom: Launch Day">
<meta property="og:description" content="Help Mochi the bunny launch a tulip. Research, breed, wrap, price and market it. A tiny game by Ariya Shahid.">
<meta property="og:image" content="https://YOUR-USERNAME.github.io/bloom/cover.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FFF4F7; --bg:#FFFFFF; --panel:#FDEDF2; --panel-2:#F8D8E2;
  --pink:#EFA9BD; --pink-deep:#D27E97; --brown:#7A5240; --brown-soft:#B98F78;
  --ink:#3D2A22; --muted:#76605A; --line:#EDCAD5; --hard:#7A5240; --on-pink:#3D2A22;
  --good:#7C9A6B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#241914; --bg:#2E211B; --panel:#3A2A23; --panel-2:#4A352C;
    --pink:#EFA9BD; --pink-deep:#F4BDCC; --brown:#E2C1AD; --brown-soft:#B98F78;
    --ink:#FBEFF2; --muted:#D7C0B7; --line:#57403A; --hard:#140E0B; --on-pink:#3D2A22; --good:#A9C496;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#241914; --bg:#2E211B; --panel:#3A2A23; --panel-2:#4A352C;
  --pink:#EFA9BD; --pink-deep:#F4BDCC; --brown:#E2C1AD; --brown-soft:#B98F78;
  --ink:#FBEFF2; --muted:#D7C0B7; --line:#57403A; --hard:#140E0B; --on-pink:#3D2A22; --good:#A9C496;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;background-color:var(--page);color:var(--ink);
  font-family:"EB Garamond",Garamond,"Times New Roman",serif;font-size:1.12rem;line-height:1.5;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:20px 20px;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--pink-deep);outline-offset:2px}
.px{font-family:"Silkscreen","Courier New",monospace;letter-spacing:.03em}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* window */
.win{max-width:500px;margin:16px auto 24px;background:var(--bg);border:3px solid var(--brown);box-shadow:6px 6px 0 var(--hard)}
.titlebar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:3px solid var(--brown);
  background:repeating-linear-gradient(to bottom,var(--pink) 0 3px,var(--panel-2) 3px 6px)}
.titlebar .dots{display:flex;gap:5px}
.titlebar .dots span{width:12px;height:12px;border:2px solid var(--brown);background:var(--bg)}
.titlebar .name{margin:0 auto;padding:1px 10px;background:var(--bg);border:2px solid var(--brown);font-size:.75rem}
.titlebar .sp{width:46px}

/* hud */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-bottom:3px solid var(--brown);font-size:.7rem;background:var(--bg)}
.hud .chips{display:flex;gap:12px}
.hud b{font-weight:400;color:var(--pink-deep)}
.steps{display:flex;gap:3px;padding:7px 10px;border-bottom:3px solid var(--brown);background:var(--panel)}
.steps span{flex:1;text-align:center;font-family:"Silkscreen",monospace;font-size:.56rem;padding:4px 0;border:2px solid var(--line);color:var(--muted);background:var(--bg);white-space:nowrap;overflow:hidden}
.steps span.done{border-color:var(--brown-soft);color:var(--brown-soft)}
.steps span.now{border-color:var(--brown);background:var(--pink);color:var(--on-pink)}

/* stage: the one bold element */
.stage{position:relative;height:150px;border-bottom:3px solid var(--brown);overflow:hidden;
  background:linear-gradient(to bottom,var(--panel) 0 78%,var(--panel-2) 78% 100%)}
.stage .floor{position:absolute;left:0;right:0;top:78%;height:3px;background:var(--brown-soft)}
.stage .mochi{position:absolute;left:18px;bottom:10px}
.stage .bouquet{position:absolute;left:96px;bottom:12px}
.stage .bubble{position:absolute;left:170px;right:12px;top:14px;background:var(--bg);border:3px solid var(--brown);padding:8px 11px;font-size:1rem;line-height:1.3;box-shadow:3px 3px 0 var(--hard)}
.stage .bubble::before{content:"";position:absolute;left:-11px;top:18px;width:8px;height:8px;background:var(--bg);border-left:3px solid var(--brown);border-bottom:3px solid var(--brown);transform:rotate(45deg)}
.stage.no-bouquet .bubble{left:110px}
.mochi svg,.bouquet svg{display:block}
.pop{animation:pop .35s steps(4)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* panel */
.panel{padding:16px 16px 18px}
.panel h2{font-weight:500;font-size:1.65rem;line-height:1.1;margin:0 0 4px}
.panel .sub{margin:0 0 14px;color:var(--muted)}
.label{font-family:"Silkscreen",monospace;font-size:.68rem;color:var(--pink-deep);margin:14px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:"Silkscreen",monospace;font-size:.78rem;letter-spacing:.03em;
  padding:11px 16px;border:3px solid var(--brown);background:var(--bg);color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--hard);text-decoration:none}
.btn.primary{background:var(--pink);color:var(--on-pink)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--hard)}
.btn.wide{width:100%}
.next{margin-top:18px}

/* persona cards */
.people{display:grid;gap:10px}
.person{display:grid;grid-template-columns:52px 1fr;gap:10px;border:3px solid var(--brown);background:var(--bg);padding:8px 10px}
.person .pic{width:52px;height:52px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center}
.person .who{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.person .who b{font-weight:600}
.person .who small{color:var(--muted);font-style:italic}
.traits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:6px}
.trait{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:3px 7px;border:2px solid var(--line);background:var(--panel);font-size:.95rem;min-height:32px}
.trait .k{font-family:"Silkscreen",monospace;font-size:.56rem;color:var(--muted)}
.trait button{border:2px solid var(--brown);background:var(--pink);color:var(--on-pink);font-family:"Silkscreen",monospace;font-size:.58rem;padding:2px 6px;cursor:pointer}
.trait button[disabled]{opacity:.4;cursor:not-allowed}
.trait.new{animation:pop .35s steps(4)}
.loyal{font-family:"Silkscreen",monospace;font-size:.55rem;color:var(--good);border:2px solid var(--good);padding:0 4px;margin-left:6px}

/* chips & options */
.chips-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--brown);background:var(--bg);padding:6px 9px;cursor:pointer;font-size:1rem;box-shadow:3px 3px 0 var(--hard)}
.chip[aria-pressed="true"]{background:var(--pink);color:var(--on-pink)}
.chip:active{transform:translate(3px,3px);box-shadow:none}
.chip .sw{width:14px;height:14px;border:2px solid var(--brown)}
.chip small{font-family:"Silkscreen",monospace;font-size:.55rem;color:var(--muted)}
.chip[aria-pressed="true"] small{color:var(--on-pink)}
.tabs{display:flex;border:3px solid var(--brown);margin-bottom:10px}
.tabs button{flex:1;border:0;border-right:3px solid var(--brown);background:var(--panel);padding:8px 4px;font-family:"Silkscreen",monospace;font-size:.62rem;cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--pink);color:var(--on-pink)}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;padding:8px 10px;border:2px dashed var(--line);font-size:.98rem}
.meta b{font-weight:600}

/* grow */
.plot{border:3px solid var(--brown);background:var(--panel);padding:12px;text-align:center}
.meter{position:relative;height:26px;border:3px solid var(--brown);background:var(--bg);margin:10px 0}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--pink)}
.meter .mark{position:absolute;top:-6px;width:6px;height:32px;background:var(--brown)}
.drops{font-family:"Silkscreen",monospace;font-size:.7rem;color:var(--muted)}
.stars{color:var(--pink-deep);letter-spacing:2px}
.codex{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.codex i{width:20px;height:20px;border:2px solid var(--brown)}
.codex i.unk{background:repeating-linear-gradient(45deg,var(--panel) 0 3px,var(--bg) 3px 6px)}

/* sliders */
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:2px dotted var(--line)}
.slider .n{font-weight:600}
.slider .who{grid-column:1/-1;font-size:.9rem;color:var(--muted);font-style:italic}
input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--pink-deep);height:26px}
.text-in{width:100%;padding:8px 10px;border:3px solid var(--brown);background:var(--bg);font-size:1.1rem}

/* launch */
.windows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.window{aspect-ratio:1;border:3px solid var(--brown);background:var(--panel);display:grid;place-items:center;cursor:pointer;position:relative;padding:0;box-shadow:3px 3px 0 var(--hard)}
.window.on{background:var(--panel-2)}
.window.served{background:var(--pink)}
.window .heart{position:absolute;top:4px;right:6px;color:var(--pink-deep);font-size:1.2rem}
.timer{height:14px;border:3px solid var(--brown);background:var(--bg);padding:2px}
.timer i{display:block;height:100%;background:var(--pink-deep)}

/* results */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:3px solid var(--brown);background:var(--panel);padding:8px 10px}
.stat b{display:block;font-family:"Silkscreen",monospace;font-weight:400;font-size:1.35rem;color:var(--pink-deep);line-height:1.15}
.stat span{font-size:.92rem;color:var(--muted);font-style:italic}
.res-row{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:2px dotted var(--line)}
.res-row .line1{display:flex;justify-content:space-between;gap:6px}
.res-row p{margin:2px 0 0;font-size:.98rem}
.take{margin-top:12px;padding:10px 12px;border:3px solid var(--brown);background:var(--pink);color:var(--on-pink)}
.event{border:3px solid var(--brown);background:var(--panel);padding:12px 14px}
.event ul{margin:6px 0 0;padding-left:1.1em}
.event li{margin:4px 0}
.event li::marker{content:"✦ ";color:var(--pink-deep)}

/* report card */
.card{border:3px solid var(--brown);background:var(--bg);box-shadow:5px 5px 0 var(--hard)}
.card .top{background:var(--pink);color:var(--on-pink);border-bottom:3px solid var(--brown);padding:8px 12px;display:flex;justify-content:space-between;font-family:"Silkscreen",monospace;font-size:.68rem}
.card .scene{display:flex;justify-content:center;align-items:flex-end;gap:12px;padding:14px 10px 6px;background:linear-gradient(to bottom,var(--panel) 0 80%,var(--panel-2) 80%)}
.card .body{padding:12px 14px}
.card h3{margin:0;font-weight:500;font-size:1.6rem;line-height:1.1}
.card .tag{margin:2px 0 10px;font-style:italic;color:var(--muted)}
.grade{float:right;width:58px;height:58px;border:3px solid var(--brown);display:grid;place-items:center;font-family:"Silkscreen",monospace;font-size:1.8rem;background:var(--panel-2);color:var(--brown);margin:0 0 6px 10px}
.card .foot{border-top:3px solid var(--brown);padding:8px 12px;font-size:.92rem;color:var(--muted);text-align:center}
.title-scene{display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:20px 0 10px}
.logo{font-family:"Silkscreen",monospace;font-size:2.3rem;line-height:1;text-align:center;margin:6px 0 4px;color:var(--pink-deep);text-shadow:3px 3px 0 var(--brown)}
.logo small{display:block;font-size:.85rem;color:var(--brown);text-shadow:none;margin-top:8px}
.center{text-align:center}
.credit{font-size:.95rem;color:var(--muted);text-align:center;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brown);color:var(--bg);font-family:"Silkscreen",monospace;font-size:.72rem;padding:9px 14px;border:3px solid var(--hard);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}

@media (max-width:520px){
  .win{margin:0;border-left:0;border-right:0;box-shadow:none;min-height:100vh}
  .titlebar .sp{display:none}
  .stage .bubble{font-size:.95rem}
}
@media (max-width:380px){
  .traits{grid-template-columns:1fr}
  .stage .bouquet{display:none}
  .stage .bubble{left:96px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar"><div class="dots" aria-hidden="true"><span></span><span></span><span></span></div><div class="name px">BLOOM.EXE</div><div class="sp" aria-hidden="true"></div></div>
  <div class="hud px" id="hud"></div>
  <div class="steps" id="steps" aria-label="Launch steps"></div>
  <div class="stage" id="stage" aria-live="polite"></div>
  <main class="panel" id="panel"></main>
</div>
<div class="toast px" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ EDIT ME ============ */
const CONFIG = {
  author: "Ariya Shahid",
  portfolio: ""   // paste your portfolio link here, e.g. https://script.google.com/macros/s/.../exec
};
/* ================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const pickW = obj => { let r = Math.random(), acc = 0; for (const [k, w] of Object.entries(obj)) { acc += w; if (r <= acc) return k; } return Object.keys(obj)[0]; };
const money = n => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2000); }

/* ---------- pixel sprites ---------- */
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const ch = s => clamp(Math.round(((n >> s) & 255) * f), 0, 255);
  return "#" + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, "0")).join("");
}
function svg(layers, px){
  const w = Math.max(...layers.flatMap(l => l.map.map(r => r.length)));
  const h = Math.max(...layers.map(l => l.map.length));
  let out = "";
  for (const { map, pal } of layers){
    map.forEach((row, y) => {
      let x = 0;
      while (x < row.length){
        const c = row[x], col = pal[c];
        if (!col){ x++; continue; }
        let run = 1;
        while (row[x + run] === c) run++;
        out += `<rect x="${x}" y="${y}" width="${run + 0.02}" height="1.02" fill="${col}"/>`;
        x += run;
      }
    });
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="${w * px}" height="${h * px}" shape-rendering="crispEdges" aria-hidden="true">${out}</svg>`;
}

const BUNNY = ["....dd....dd....","...dbbd..dbbd...","...dbpd..dbpd...","...dbpd..dbpd...","...dbpd..dbpd...","...dbbd..dbbd...","..ddbbbddbbbdd..",".dbbbbbbbbbbbbd.",".dbbkbbbbbbkbbd.",".dbbkbbbbbbkbbd.",".dbcbbbnnbbbcbd.",".dbbbbbwwbbbbbd.","..dbbbbbbbbbbd..","...ddbbbbbbdd...","..dbbwwwwwwbbd..",".dbbwwwwwwwwbbd.",".dbbwwwwwwwwbbd.","..dbbwwwwwwbbd..","..dbbd....dbbd..","..dddd....dddd.."];
const BUNNY_PAL = { d:"#5B3A2C", b:"#8A5A44", p:"#F2A3B8", w:"#FBEFE6", k:"#2B1B14", c:"#F2A3B8", n:"#E07A98" };
const OUTFIT_MAPS = {
  bow:    { map: ["","","","","","..qq.qq.........","..qqQqq.........","...q...q........"], pal: { q:"#E07A98", Q:"#B9506F" } },
  sunhat: { map: ["","","","","....tttttttt....","....qqqqqqqq....","TttttttttttttttT"], pal: { t:"#EBCB8B", T:"#C9A266", q:"#E07A98" } },
  crown:  { map: ["","","","","","...f.......f....","..fgf.lgl.fgf..."], pal: { f:"#F2A3B8", g:"#FFFFFF", l:"#9DB58A" } },
  beret:  { map: ["","","","..........e.....","........eeeee...",".......eeeeeee..","......eeeeeeeeE."], pal: { e:"#E07A98", E:"#B9506F" } },
  scarf:  { map: ["","","","","","","","","","","","","","...ssssssssss...","..........sS....","..........sS....","...........S...."], pal: { s:"#E07A98", S:"#B9506F" } },
  pearls: { map: ["","","","","","","","","","","","","","....o.o.o.o.o..."], pal: { o:"#FFFDF8" } },
  apron:  { map: ["","","","","","","","","","","","","","....a......a....","....aaaaaaaa....","....aaaaaaaa....","....aaAAAaaa....",".....aaaaaa....."], pal: { a:"#C9A27E", A:"#A7805F" } },
  dress:  { map: ["","","","","","","","","","","","","","","...xxxxxxxxxx...","..xxzxxxxzxxxx..","..xxxxxzxxxxzx..",".xxzxxxxxzxxxxx."], pal: { x:"#F2A3B8", z:"#FFFFFF" } },
  smock:  { map: ["","","","","","","","","","","","","","","....mmmmmmmm....","...mmmmmmmmmm...","...mmmMMmmmmm...","....mmmmmmmm...."], pal: { m:"#FBF6EE", M:"#E2D6C8" } }
};
function mochi(outfit, px){
  const layers = [{ map: BUNNY, pal: BUNNY_PAL }];
  for (const slot of ["body", "neck", "head"]){
    const id = outfit && outfit[slot];
    if (id && OUTFIT_MAPS[id]) layers.push(OUTFIT_MAPS[id]);
  }
  return svg(layers, px);
}
const TULIP = [".d.d.d..",".dpdpd..",".ppppp..",".phppp..","..ppp...","...s....",".l.s.l..",".llsll..","...s...."];
function tulip(color, px){
  const hex = COLORS[color].hex;
  return svg([{ map: TULIP, pal: { p: hex, d: shade(hex, .82), h: shade(hex, 1.12), s: "#7C9A6B", l: "#9DB58A" } }], px);
}
const BOUQUET = ["..d.d..d.d..d.d.","..dpd..dpd..dpd.","..ppp..ppp..ppp.","..php..php..php.","...s....s....s..","...s....s....s..","..wwwwwwwwwwwww.","..wWwwwwwwwwwWw.","...wwwwwwwwwww..","...wWwwwwwwwWw..","....wwwRRRwww...","....wwRRRRRww...",".....wwRRRwwT...",".....wwwwwwwTT..","......wwwww.....",".......www......","........w......."];
function bouquet(st, px){
  const hex = st.flower ? COLORS[st.flower.color].hex : "#F2A3B8";
  const wrap = WRAPS.find(w => w.id === st.pack.wrap) || WRAPS[0];
  const rib = RIBBONS.find(r => r.id === st.pack.ribbon) || RIBBONS[0];
  const tag = TAGS.find(t => t.id === st.pack.tag) || TAGS[0];
  return svg([{ map: BOUQUET, pal: { p: hex, d: shade(hex, .82), h: shade(hex, 1.12), s: "#7C9A6B", w: wrap.color, W: shade(wrap.color, .85), R: rib.color, T: tag.color } }], px);
}
const CRITTERS = {

/* ---------- economy ---------- */
function majority(styles){
  const c = {}; styles.filter(Boolean).forEach(s => c[s] = (c[s] || 0) + 1);
  const best = Object.entries(c).sort((a, b) => b[1] - a[1]);
  return best.length && (best.length === 1 || best[0][1] > best[1][1]) ? best[0][0] : null;
}
const packPieces = () => [WRAPS.find(w => w.id === S.pack.wrap), RIBBONS.find(r => r.id === S.pack.ribbon), TAGS.find(t => t.id === S.pack.tag)];
const packStyle = () => majority(packPieces().map(p => p.style));
const outfitStyle = () => majority(["head", "neck", "body"].map(k => (OUTFIT[k].find(o => o.id === S.outfit[k]) || {}).style));
const unitCost = () => FLOWER_COST[COLORS[S.flower.color].tier] + packPieces().reduce((a, p) => a + p.cost, 0);
const sizeOf = p => p.size * (S.season === 4 ? ({ ros:2, wren:1.5 }[p.id] || 1) : 1);

function evaluate(p){
  const color = S.flower.color, fav = p.fav;
  let colorFit = color === fav ? 1 : COLORS[color].fam === COLORS[fav].fam ? .55 : .2;
  if (S.season === 3 && COLORS[color].fam === "warm") colorFit = Math.min(1, colorFit + .2);
  const styleFit = packPieces().filter(x => x.style === p.style).length / 3;
  const tagFit = TAGLINES[S.tagline].style === p.style ? 1 : .35;
  const qual = S.flower.stars / 3;
  const consistent = packStyle() && packStyle() === outfitStyle();
  let appeal = .4 * colorFit + .25 * styleFit + .15 * tagFit + .2 * qual + (consistent ? .05 : 0) + (S.season === 4 && packStyle() === "luxe" ? .08 : 0);
  appeal = Math.min(1, appeal);
  const ratio = S.price / p.budget;
  const priceF = ratio <= 1 ? 1 - .25 * ratio : Math.max(0, 1 - (ratio - 1) / .3) * .6;
  let reach = 1 - Math.exp(-(S.spend[p.channel] || 0) / 28);
  if (S.season >= 3) reach += (1 - reach) * (1 - Math.exp(-S.spend.fair / 40)) * .6;
  reach = Math.min(1, reach + (p.loyal ? .25 : 0) + .05);
  let buyers = sizeOf(p) * reach * Math.pow(appeal, 1.3) * priceF * 1.4;
  const rivalTook = S.season >= 2 && appeal < .7;
  if (rivalTook) buyers *= .75;
  const love = clamp(appeal * (ratio <= 1 ? 1 : .6), 0, 1);
  return { colorFit, styleFit, tagFit, appeal, reach, priceF, ratio, buyers, love, rivalTook };
}
function predictTotal(){ return S.personas.reduce((a, p) => a + evaluate(p).buyers, 0); }

SCREENS.grow = {

        <p class="drops">Rarity ${"♦".repeat(COLORS[S.flower.color].tier)}, costs $${FLOWER_COST[COLORS[S.flower.color].tier]} a stem to grow</p></div>` : "";
    return `<h2>Grow a tulip</h2>
      <p class="sub">Pick two parents. Crossing different colors can make a new one. You have ${S.plots} plot${S.plots === 1 ? "" : "s"} left this season.</p>

        <button class="btn primary" data-act="plant" ${g.a && g.b && S.plots ? "" : "disabled"}>🌱 Plant${g.a && g.b ? ` ${g.a} × ${g.b}` : ""}</button>
        ${S.flower ? `<button class="btn" data-act="to" data-to="wrap">▶ Use this flower</button>` : ""}
      </div>`;
  },
  after(){ if (S.grow && S.grow.phase === "water") startWatering(); }
};
function crossResult(a, b){
  if (a === b) return { color:a };
  const key = [a, b].sort().join("+");
  const res = CROSSES[key];
  if (res && COLORS[res].tier === 3 && S.season < 2) return { color: COLORS[a].tier >= COLORS[b].tier ? a : b, locked: res };
  if (res) return { color: res };
  return { color: COLORS[a].tier >= COLORS[b].tier ? a : b, dud:true };
}
let waterRAF = 0;
function startWatering(){
  const g = S.grow; g.left = 3; g.hits = 0;
  const zone = $("#zone"), mark = $("#mark");
  const zw = S.season >= 2 ? 26 : 30;
  g.z0 = rand(10, 90 - zw); g.z1 = g.z0 + zw;
  zone.style.left = g.z0 + "%"; zone.style.width = zw + "%";
  const t0 = performance.now();
  const speed = 0.9 + S.season * 0.12;
  cancelAnimationFrame(waterRAF);
  (function tick(t){
    if (!document.body.contains(mark)) return;
    g.pos = 50 + 48 * Math.sin((t - t0) / 1000 * Math.PI * speed);
    mark.style.left = `calc(${g.pos}% - 3px)`;
    waterRAF = requestAnimationFrame(tick);
  })(t0);
}
function water(){
  const g = S.grow;
  const hit = g.pos >= g.z0 && g.pos <= g.z1;
  if (hit) g.hits++;
  g.left--;
  toast(hit ? "Perfect watering!" : "A little off");
  $("#drops").textContent = `Waterings left: ${g.left}`;
  if (g.left > 0){ const zw = g.z1 - g.z0; g.z0 = rand(10, 90 - zw); g.z1 = g.z0 + zw; $("#zone").style.left = g.z0 + "%"; return; }
  cancelAnimationFrame(waterRAF);
  const res = crossResult(g.a, g.b);
  const stars = [1, 2, 2, 3][g.hits];
  const isNew = !S.discovered.includes(res.color);
  if (isNew) S.discovered.push(res.color);
  S.flower = { color: res.color, stars };
  S.plots--;
  S.grow = { a:null, b:null, phase:"pick" };
  go("grow");
  if (res.locked) toast(`That cross makes something rare. The greenhouse unlocks in Year One.`);
  else if (isNew) toast(`New color discovered: ${res.color}!`);
  else if (res.dud) toast(`Those two don’t mix. You got ${res.color}.`);
}

      ${body}
      <div class="meta"><span>Bouquet look: <b>${ps || "mixed"}</b></span><span>Mochi’s look: <b>${os || "mixed"}</b></span><span>Cost per bouquet: <b>$${unitCost().toFixed(2)}</b></span></div>
      ${ps && ps === os ? `<p class="credit" style="margin-top:8px">✦ On-brand! Matching looks give a small boost.</p>` : ""}
      <button class="btn primary wide next" data-act="to" data-to="position">▶ Looks good</button>`;
  }
};

/* position + price */
const NAME_IDEAS = ["Morning Kiss", "Petal Pop", "Little Lantern", "Sunday Best", "Cloud Nine", "First Light", "Honey Cup", "Velvet Wish"];
SCREENS.position = {
  html(){
    if (!S.name) S.name = pick(NAME_IDEAS);
    const known = S.personas.filter(p => p.known.budget).map(p => `${p.name}: up to $${p.budget}`).join(", ");
    return `<h2>Name it and price it</h2><p class="sub">This is your positioning: what you call it, the promise you make, and what it’s worth.</p>
      <div class="label">Flower name</div>
      <div class="row" style="flex-wrap:nowrap"><input class="text-in" id="fname" maxlength="22" value="${esc(S.name)}" aria-label="Flower name"><button class="btn" data-act="rename" aria-label="Suggest a name">🎲</button></div>
      <div class="label">Tagline</div>
      <div class="chips-row">${TAGLINES.map((t, i) => `<button class="chip" data-act="tagline" data-i="${i}" aria-pressed="${S.tagline === i}">${esc(t.text)} <small>${t.style}</small></button>`).join("")}</div>
      <div class="label">Price per bouquet</div>
      <div class="slider"><span>Price</span><span class="n" id="priceOut">$${S.price}</span>
        <input type="range" id="price" min="4" max="34" step="1" value="${S.price}" aria-label="Price"></div>
      <div class="meta"><span>Cost to make: <b>$${unitCost().toFixed(2)}</b></span><span id="margin"></span></div>
      <p class="credit" style="text-align:left">${known ? "What you heard: " + esc(known) + "." : "You didn’t ask anyone about budget, so this is a guess."}</p>
      <button class="btn primary wide next" data-act="to" data-to="market">▶ Lock it in</button>`;
  },
  after(){
    const upd = () => { S.price = +$("#price").value; $("#priceOut").textContent = "$" + S.price; const m = S.price - unitCost(); $("#margin").innerHTML = `Profit per bouquet: <b>${m < 0 ? "-" : ""}$${Math.abs(m).toFixed(2)}</b>`; };
    $("#price").addEventListener("input", upd); upd();
    $("#fname").addEventListener("input", e => { S.name = e.target.value.trim() || S.name; });
  }
};

/* go to market */
SCREENS.market = {
  html(){
    const chans = Object.entries(CHANNELS).filter(([, c]) => !c.from || S.season >= c.from);
    return `<h2>Spend your marketing</h2><p class="sub">You have <b id="left">${S.coins}</b> coins left of ${S.coins}. Customers only hear about you where they actually hang out.</p>
      ${chans.map(([k, c]) => {
        const who = S.personas.filter(p => p.known.channel && p.channel === k).map(p => p.name);
        return `<div class="slider"><span>${c.name}</span><span class="n" id="o-${k}">${S.spend[k]}</span>
          <input type="range" min="0" max="${S.coins}" step="5" value="${S.spend[k]}" data-ch="${k}" aria-label="${c.name} spend">
          <span class="who">${k === "fair" ? "Reaches everyone a little." : who.length ? "You know " + who.join(" and ") + " hang" + (who.length === 1 ? "s" : "") + " out here." : "No one told you they hang out here."}</span></div>`;
      }).join("")}
      <button class="btn primary wide next" data-act="to" data-to="launch">▶ Launch day</button>`;
  },
  after(){
    const inputs = [...document.querySelectorAll("input[data-ch]")];
    const sync = changed => {
      let total = inputs.reduce((a, i) => a + +i.value, 0);
      if (total > S.coins && changed){ changed.value = +changed.value - (total - S.coins); total = S.coins; }
      inputs.forEach(i => { S.spend[i.dataset.ch] = +i.value; $("#o-" + i.dataset.ch).textContent = i.value; });
      $("#left").textContent = S.coins - total;
    };
    inputs.forEach(i => i.addEventListener("input", () => sync(i)));
    sync();
  }
};

/* launch day: tap game */
SCREENS.launch = {
  html(){
    return `<h2>Launch day</h2><p class="sub">Customers pop up at the stall. Tap them before they wander off.</p>
      <div class="timer"><i id="tbar" style="width:100%"></i></div>
      <div class="windows" id="wins">${Array.from({ length: 6 }, (_, i) => `<button class="window" data-act="serve" data-w="${i}" aria-label="Stall window ${i + 1}"></button>`).join("")}</div>
      <p class="drops center" id="served" style="margin-top:10px">Served: 0</p>
      <div id="launchEnd"></div>`;
  },
  after(){ runLaunch(); }
};
let L = null;
function runLaunch(){
  const evals = S.personas.map(p => ({ p, e: evaluate(p) }));
  const total = evals.reduce((a, x) => a + x.e.buyers, 0);
  const spawns = clamp(Math.round(total / 2.2), 6, 22);
  const weights = evals.map(x => x.e.buyers + .3);
  const wsum = weights.reduce((a, b) => a + b, 0);
  const queue = Array.from({ length: spawns }, () => { let r = Math.random() * wsum; for (let i = 0; i < evals.length; i++){ r -= weights[i]; if (r <= 0) return evals[i].p; } return evals[0].p; });
  const DUR = 18000, life = clamp(1500 - S.season * 90, 1050, 1500);
  L = { evals, total, spawns, served:0, slots: Array(6).fill(null), t0: performance.now(), next:0, queue, life, done:false };
  const gap = (DUR - life) / spawns;
  const wins = [...document.querySelectorAll(".window")];
  function tick(t){
    if (!L || L.done || !document.body.contains(wins[0])) return;
    const el = t - L.t0;
    $("#tbar").style.width = Math.max(0, 100 - el / DUR * 100) + "%";
    while (L.next < L.queue.length && el >= L.next * gap + 300){
      const free = L.slots.map((s, i) => s ? -1 : i).filter(i => i >= 0);
      if (!free.length) break;
      const i = pick(free), p = L.queue[L.next++];
      L.slots[i] = { p, until: el + L.life };
      wins[i].classList.add("on"); wins[i].classList.remove("served");
      wins[i].innerHTML = critter(p.sprite, 4);
      wins[i].setAttribute("aria-label", `Serve ${p.name}`);
    }
    L.slots.forEach((s, i) => { if (s && !s.served && el > s.until){ L.slots[i] = null; wins[i].className = "window"; wins[i].innerHTML = ""; wins[i].setAttribute("aria-label", "Empty stall window"); } });
    if (el >= DUR){ L.done = true; finishLaunch(); return; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function serve(i){
  if (!L || L.done) return;
  const s = L.slots[i];
  const w = document.querySelectorAll(".window")[i];
  if (!s || s.served) return;
  s.served = true; L.served++;
  w.className = "window served";
  w.innerHTML = critter(s.p.sprite, 4) + `<span class="heart">♥</span>`;
  $("#served").textContent = `Served: ${L.served}`;
  setTimeout(() => { if (L && L.slots[i] === s){ L.slots[i] = null; w.className = "window"; w.innerHTML = ""; } }, 380);
}
function finishLaunch(){
  const mult = .85 + .3 * (L.served / L.spawns);
  const rows = L.evals.map(({ p, e }) => ({ p, e, sold: Math.round(e.buyers * mult) }));
  const sold = rows.reduce((a, r) => a + r.sold, 0);
  const revenue = sold * S.price;
  const spend = Object.values(S.spend).reduce((a, b) => a + b, 0);
  const cost = sold * unitCost() + spend;
  const profit = revenue - cost;
  const sizeSum = rows.reduce((a, r) => a + sizeOf(r.p), 0);
  const love = rows.reduce((a, r) => a + r.e.love * sizeOf(r.p), 0) / sizeSum;
  const reach = rows.reduce((a, r) => a + r.e.reach * sizeOf(r.p), 0) / sizeSum;
  const pts = love * 60 + clamp(profit / 160, 0, 1) * 40;
  const grade = pts >= 82 ? "S" : pts >= 68 ? "A" : pts >= 52 ? "B" : pts >= 36 ? "C" : "D";
  rows.forEach(r => r.why = insight(r));
  const lesson = biggestLesson(rows);
  S.result = { rows: rows.map(r => ({ id:r.p.id, sold:r.sold, love:r.e.love, reach:r.e.reach, why:r.why })), sold, revenue, cost, spend, profit, love, reach, grade, served:L.served, spawns:L.spawns, lesson,
               name:S.name, tagline:TAGLINES[S.tagline].text, color:S.flower.color, stars:S.flower.stars, price:S.price, season:S.season };
  S.history.push({ season:S.season, name:S.name, color:S.flower.color, profit, revenue, sold, love, grade });
  S.total.revenue += revenue; S.total.profit += profit; S.total.sold += sold;
  rows.forEach(r => { r.p.loyal = r.e.love >= .7 && r.sold > 0; });
  L = null;
  save();
  $("#launchEnd").innerHTML = `<button class="btn primary wide next" data-act="to" data-to="results">▶ See results</button>`;
  toast("Launch day is over!");
}
function insight(r){
  const { p, e } = r;
  if (e.reach < .35){ p.known.channel = true; return `${p.name} never heard about it. They hang out at ${CHANNELS[p.channel].name}.`; }
  if (e.ratio > 1){ p.known.budget = true; return `${p.name} liked it, but $${S.price} was over their $${p.budget} budget.`; }
  if (e.colorFit < .6){ p.known.color = true; return `${p.name} was hoping for ${p.fav.toLowerCase()}, not ${S.flower.color.toLowerCase()}.`; }
  if (e.styleFit < .5){ p.known.style = true; return `${p.name} prefers a ${p.style} look.`; }
  if (e.rivalTook) return `${p.name} was tempted by Thornbury Blooms. A stronger fit would win them over.`;
  return `${p.name} loved it.${r.sold ? ` ${r.sold} bought one.` : ""}`;
}
function biggestLesson(rows){
  const lost = { reach:0, price:0, color:0, style:0 };
  rows.forEach(({ p, e }) => {
    const n = sizeOf(p);
    lost.reach += n * (1 - e.reach);
    lost.price += e.ratio > 1 ? n * e.reach : 0;
    lost.color += n * e.reach * (1 - e.colorFit) * .6;
    lost.style += n * e.reach * (1 - e.styleFit) * .4;
  });
  const top = Object.entries(lost).sort((a, b) => b[1] - a[1])[0][0];
  return { reach:"Most people never heard about us. Next time, put coins where customers hang out.",
           price:"We priced some customers out. Knowing budgets would have paid for itself.",
           color:"The color missed for a lot of people. A little more research on favorites goes a long way.",
           style:"The packaging didn’t match our customers’ style. On-brand wrapping sells." }[top];
}

/* results */
SCREENS.results = {
  hint(){ return S.result.lesson; },
  html(){
    const r = S.result;
    const last = S.mode === "year" && S.season === 4;
    const next = S.mode === "first" ? `<button class="btn primary wide next" data-act="to" data-to="report">▶ See launch report</button>`
      : last ? `<button class="btn primary wide next" data-act="to" data-to="year">▶ See Year One report</button>`
      : `<button class="btn primary wide next" data-act="nextSeason">▶ On to ${SEASONS[S.season + 1].name}</button>`;
    return `<h2>${esc(r.name)}: results</h2><p class="sub">You served ${r.served} of ${r.spawns} customers at the stall.</p>
      <div class="stats">
        <div class="stat"><b>${r.sold}</b><span>bouquets sold</span></div>
        <div class="stat"><b>${money(r.revenue)}</b><span>revenue</span></div>
        <div class="stat"><b>${money(r.profit)}</b><span>profit after costs</span></div>
        <div class="stat"><b>${Math.round(r.love * 100)}%</b><span>customer love</span></div>
      </div>
      <div class="label">What customers said</div>
      ${r.rows.map(row => { const p = S.personas.find(x => x.id === row.id); return `<div class="res-row"><div>${critter(p.sprite, 3)}</div><div><div class="line1"><b>${esc(p.name)}</b><span class="stars">${"♥".repeat(Math.round(row.love * 5))}${"♡".repeat(5 - Math.round(row.love * 5))}</span></div><p>${esc(row.why)}</p></div></div>`; }).join("")}
      <p class="credit" style="text-align:left">Anything customers revealed is now in your notes for next time.</p>
      ${next}`;
  }
};

/* season 1 report card */
function reportCard(r){
  return `<div class="card" id="reportCard">
    <div class="top"><span>Launch report</span><span>Season ${r.season}: ${SEASONS[r.season].name}</span></div>
    <div class="scene">${mochi(S.outfit, 5)}${bouquet(S, 5)}</div>
    <div class="body"><div class="grade" aria-label="Grade ${r.grade}">${r.grade}</div>
      <h3>${esc(r.name)}</h3><p class="tag">“${esc(r.tagline)}” A ${r.color.toLowerCase()} tulip at $${r.price}.</p>
      <div class="stats" style="clear:both">
        <div class="stat"><b>${r.sold}</b><span>sold</span></div><div class="stat"><b>${money(r.profit)}</b><span>profit</span></div>
        <div class="stat"><b>${Math.round(r.reach * 100)}%</b><span>of town reached</span></div><div class="stat"><b>${Math.round(r.love * 100)}%</b><span>customer love</span></div>
      </div>
      <p style="margin:10px 0 0"><b>Lesson:</b> ${esc(r.lesson)}</p></div>
    <div class="foot">Bloom: Launch Day, a tiny game by ${esc(CONFIG.author)}</div></div>`;
}
SCREENS.report = {
  noStage: true,
  html(){
    return `${reportCard(S.result)}
      <p class="center sub" style="margin-top:16px">That was one season. Year One adds three more: a rival shop, rare greenhouse colors, shifting trends and loyal fans.</p>
      <div class="row" style="justify-content:center">
        <button class="btn primary" data-act="year">▶ Play Year One</button>
        <button class="btn" data-act="restart">Play again</button>
      </div>
      ${CONFIG.portfolio ? `<p class="center" style="margin-top:14px"><a class="btn" href="${esc(CONFIG.portfolio)}" target="_blank" rel="noopener">Visit ${esc(CONFIG.author.split(" ")[0])}’s portfolio</a></p>` : ""}
      <p class="credit">Screenshot your report card to share it.</p>`;
  }
};

/* year-end report */
SCREENS.year = {
  noStage: true,
  html(){
    const t = S.total;
    const title = t.profit >= 650 ? "Chief Petal Officer" : t.profit >= 350 ? "Head of Bloom Marketing" : t.profit >= 120 ? "Junior Bloom Marketer" : "Seedling Seller";
    const best = [...S.history].sort((a, b) => b.profit - a.profit)[0];
    const fans = S.personas.filter(p => p.loyal).map(p => p.name);
    const avgLove = S.history.reduce((a, h) => a + h.love, 0) / S.history.length;
    store.del("bloom-save");
    return `<div class="card">
      <div class="top"><span>Year One report</span><span>4 seasons</span></div>
      <div class="scene">${mochi(S.outfit, 5)}${bouquet(S, 5)}</div>
      <div class="body"><p class="tag" style="margin:0">Mochi’s new title</p><h3>${title}</h3>
        <div class="stats" style="margin-top:10px">
          <div class="stat"><b>${t.sold}</b><span>bouquets sold</span></div><div class="stat"><b>${money(t.profit)}</b><span>total profit</span></div>
          <div class="stat"><b>${S.discovered.length}/${COLOR_ORDER.length}</b><span>colors discovered</span></div><div class="stat"><b>${Math.round(avgLove * 100)}%</b><span>average love</span></div>
        </div>
        <div class="label">Season by season</div>
        ${S.history.map(h => `<div class="meta" style="margin-top:6px"><span>${SEASONS[h.season].name}: <b>${esc(h.name)}</b> (${h.color.toLowerCase()})</span><span>${money(h.profit)}, grade ${h.grade}</span></div>`).join("")}
        <p style="margin:12px 0 0">Best launch: <b>${esc(best.name)}</b>. ${fans.length ? `Loyal fans: ${esc(fans.join(", "))}.` : "No loyal fans yet. Love above 70% turns customers into fans."}</p></div>
      <div class="foot">Bloom: Launch Day, a tiny game by ${esc(CONFIG.author)}</div></div>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" data-act="restart">Play again</button>
      ${CONFIG.portfolio ? `<a class="btn" href="${esc(CONFIG.portfolio)}" target="_blank" rel="noopener">Visit ${esc(CONFIG.author.split(" ")[0])}’s portfolio</a>` : ""}</div>`;
  }
};

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "start"){ newGame(); startSeason(1); go("research"); }
  else if (a === "continue"){
    S = store.get("bloom-save");
    if (S.screen === "results" || S.screen === "launch"){ if (S.season >= 4) go("year"); else nextSeason(); }
    else go("event");
  }
  else if (a === "to"){
    if (b.dataset.to === "position" && !S.flower) return;
    go(b.dataset.to);
  }
  else if (a === "ask"){
    if (!S.carrots) return;
    const p = S.personas.find(x => x.id === b.dataset.p);
    p.known[b.dataset.k] = true; S.carrots--;
    const tip = $("#blindTip"); if (tip) tip.remove();
    renderChrome();
    document.querySelectorAll(".person").forEach(el => { const q = S.personas.find(x => x.id === el.dataset.p); el.outerHTML = personCard(q, q === p ? b.dataset.k : null); });
    if (!S.carrots) document.querySelector("[data-to='grow']").textContent = "▶ Out of carrots, let’s grow";
  }
  else if (a === "parent"){
    const g = S.grow, c = b.dataset.c;
    if (g.a === c && g.b === c) { g.b = null; }
    else if (g.a === c && !g.b) { g.b = c; }
    else if (!g.a) g.a = c;
    else if (!g.b) g.b = c;
    else { g.a = c; g.b = null; }
    go("grow");
  }
  else if (a === "plant"){ S.grow.phase = "water"; go("grow"); }
  else if (a === "water"){ water(); }
  else if (a === "wtab"){ S.wrapTab = b.dataset.t; go("wrap"); }
  else if (a === "pack"){ S.pack[b.dataset.slot] = b.dataset.id; go("wrap"); }
  else if (a === "dress"){ S.outfit[b.dataset.slot] = b.dataset.id === "null" || !b.dataset.id ? null : b.dataset.id; go("wrap"); }
  else if (a === "tagline"){ S.tagline = +b.dataset.i; document.querySelectorAll("[data-act='tagline']").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }
  else if (a === "rename"){ S.name = pick(NAME_IDEAS.filter(n => n !== S.name)); $("#fname").value = S.name; }
  else if (a === "serve"){ serve(+b.dataset.w); }
  else if (a === "year"){ S.mode = "year"; nextSeason(); }
  else if (a === "nextSeason"){ nextSeason(); }
  else if (a === "restart"){ store.del("bloom-save"); newGame(); go("title"); }
});
function nextSeason(){ startSeason(S.season + 1); S.screen = "event"; save(); go("event"); }

newGame();
go("title");
</script>
