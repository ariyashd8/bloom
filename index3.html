<meta property="og:description" content="Merge flowers, fill orders, decorate your boutique. A cozy merge game by Ariya Shahid.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href='data:application/manifest+json,{"name":"Bloom %26 Co.","short_name":"Bloom","display":"standalone","orientation":"portrait","background_color":"%23FFF7FA","theme_color":"%23F9C5D5","start_url":"./index3.html","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2724%27 fill=%27%23F9C5D5%27/%3E%3Ccircle cx=%2750%27 cy=%2744%27 r=%2718%27 fill=%27%23F28DAA%27/%3E%3Ccircle cx=%2750%27 cy=%2744%27 r=%277%27 fill=%27%23FFE9A8%27/%3E%3Crect x=%2747%27 y=%2760%27 width=%276%27 height=%2726%27 rx=%273%27 fill=%27%237DBA8F%27/%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23F9C5D5'/%3E%3Ccircle cx='50' cy='44' r='18' fill='%23F28DAA'/%3E%3Ccircle cx='50' cy='44' r='7' fill='%23FFE9A8'/%3E%3Crect x='47' y='60' width='6' height='26' rx='3' fill='%237DBA8F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4F8; --card:#FFFDFB; --card2:#FFF1F5;
  --pink:#F9C5D5; --rose:#F28DAA; --rose-deep:#D96A8C;
  --mint:#BFE8D8; --mint-deep:#7DBA8F; --sky:#CDE7F7; --lilac:#DCCDF4; --lilac-deep:#A98BD6;
  --butter:#FFE9A8; --peach:#FFD3B6; --ink:#4A3B45; --muted:#8E7B86; --line:#F3DCE5;
  --shadow:0 6px 18px rgba(214,140,170,.18), 0 1px 0 rgba(255,255,255,.8) inset;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;overflow:hidden;
  background-image:radial-gradient(circle at 20% 10%,rgba(249,197,213,.55),transparent 45%),radial-gradient(circle at 85% 90%,rgba(205,231,247,.6),transparent 45%),radial-gradient(circle at 70% 20%,rgba(220,205,244,.5),transparent 40%);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1,h2,h3,.f{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;letter-spacing:.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{transform:scale(.97)}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px)}
@media (min-width:520px){#app{height:min(100dvh,900px);margin-top:max(0px,calc((100dvh - 900px)/2));border-radius:36px;box-shadow:0 30px 80px rgba(120,60,90,.25),0 0 0 10px #fff,0 0 0 12px rgba(214,140,170,.35);background:var(--bg)}}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;flex:none}
.hud .lvl{position:relative;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;box-shadow:var(--shadow);min-width:0}
.hud .lvl .n{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;display:grid;place-items:center;font-weight:700;font-family:"Fredoka";font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.08) inset}
.hud .xp{width:72px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.hud .xp i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--lilac-deep));border-radius:99px;transition:width .4s}
.hud .cur{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 10px 4px 6px;box-shadow:var(--shadow);font-weight:800;font-size:14px}
.hud .cur svg{width:22px;height:22px}
.hud .cur.gem b{color:#7E62C9}
.hud .cur.coin b{color:#C78A1F}
.hud .sp{flex:1}
.hud .ic{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px}

/* storefront */
.front{position:relative;margin:4px 12px 0;height:190px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);flex:none;background:#CDE7F7}
.front svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.front .bubble{position:absolute;right:12px;top:14px;max-width:62%;background:#fff;border-radius:16px 16px 4px 16px;padding:8px 12px;font-size:13px;line-height:1.3;box-shadow:0 4px 14px rgba(80,40,60,.15);animation:in .3s ease-out}
.front .bubble b{color:var(--rose-deep)}
.front .bubble::after{content:"";position:absolute;right:16px;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.front .bubble.left{right:auto;left:12px;border-radius:16px 16px 16px 4px}
.front .bubble.left::after{right:auto;left:16px}
.front .night-tag{position:absolute;left:10px;top:10px;background:rgba(40,30,70,.6);color:#fff;font-size:11px;padding:3px 9px;border-radius:99px;backdrop-filter:blur(4px)}
@keyframes in{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(520px)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:center bottom}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* orders */
.orders{display:flex;gap:8px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none;flex:none}
.orders::-webkit-scrollbar{display:none}
.order{flex:none;width:132px;background:var(--card);border-radius:18px;padding:8px 8px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;position:relative;animation:in .3s ease-out}
.order .who{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px}
.order .who .av{width:28px;height:28px;border-radius:50%;background:var(--card2);overflow:hidden;flex:none}
.order .who .av svg{width:100%;height:100%}
.order .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order .needs{display:flex;gap:4px;justify-content:center;min-height:44px}
.order .need{position:relative;width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.order .need svg{width:38px;height:38px}
.order .need.ok{background:#E3F6EA;box-shadow:0 0 0 2px var(--mint-deep) inset}
.order .need.ok::after{content:"✓";position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--mint-deep);color:#fff;font-size:10px;display:grid;place-items:center;font-weight:800}
.order .need small{position:absolute;left:3px;bottom:2px;font-size:10px;font-weight:800;color:var(--muted)}
.order .rew{display:flex;justify-content:center;gap:8px;font-size:11px;font-weight:800;color:var(--muted)}
.order .rew b{color:#C78A1F}.order .rew b.g{color:#7E62C9}
.order .go{border-radius:12px;padding:6px;font-weight:800;font-size:12px;background:var(--line);color:var(--muted);transition:.2s}
.order .go.ready{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;box-shadow:0 3px 0 #B9506F;animation:pulse 1.4s ease-in-out infinite}
.order .go.ready:active{transform:translateY(2px);box-shadow:0 1px 0 #B9506F}
.order .skip{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);font-size:11px;color:var(--muted);display:grid;place-items:center}
.order.night{background:linear-gradient(160deg,#3B3160,#5B4A86);color:#fff}
.order.night .who .av{background:rgba(255,255,255,.15)}
.order.night .rew{color:#D9CCF4}.order.night .need{background:rgba(255,255,255,.12)}
.order.done{animation:done .45s ease-in forwards}
@keyframes done{to{opacity:0;transform:scale(.6) translateY(-20px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* board */
.boardwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 12px 4px;min-height:0}
.board{position:relative;width:240px;height:280px;flex:none;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:6px;touch-action:none}
.cells{position:absolute;inset:6px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(7,1fr);gap:4px}
.cell{border-radius:12px;background:var(--card2);position:relative}
.cell.lock{background:repeating-linear-gradient(135deg,#DCEFE3 0 6px,#CFE8D8 6px 12px)}
.cell.lock::before{content:"";position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),transparent 55%)}
.cell.target{background:#E3F6EA;box-shadow:0 0 0 3px var(--mint-deep) inset}
.cell.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(242,141,170,0)}50%{box-shadow:0 0 0 4px rgba(242,141,170,.6)}}
.unlockrow{position:absolute;left:6px;right:6px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.unlockrow button{pointer-events:auto;background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;font-size:12px;box-shadow:0 4px 12px rgba(80,40,60,.15);display:flex;gap:6px;align-items:center}
.unlockrow button svg{width:16px;height:16px}
.unlockrow button.cant{opacity:.7}
.item{position:absolute;width:calc((100% - 12px - 20px) / 6);height:calc((100% - 12px - 24px) / 7);display:grid;place-items:center;touch-action:none;will-change:transform;cursor:grab}
.item svg{width:92%;height:92%;filter:drop-shadow(0 2px 2px rgba(80,40,60,.18))}
.item.drag{z-index:20;cursor:grabbing}
.item.drag svg{transform:scale(1.12);filter:drop-shadow(0 10px 10px rgba(80,40,60,.3))}
.item.new svg{animation:popin .32s cubic-bezier(.3,1.6,.5,1)}
.item.merged svg{animation:popm .4s cubic-bezier(.3,1.6,.5,1)}
.item.selected::before{content:"";position:absolute;inset:2px;border-radius:12px;box-shadow:0 0 0 3px var(--rose) inset}
.item.wanted::after{content:"";position:absolute;right:4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--mint-deep);box-shadow:0 0 0 2px #fff}
.item .badge{position:absolute;right:3px;bottom:3px;background:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:0 5px;box-shadow:0 1px 4px rgba(0,0,0,.15);color:var(--ink)}
.item .badge.empty{color:var(--muted)}
.item .ring{position:absolute;inset:4px;border-radius:50%;pointer-events:none}
@keyframes popin{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes popm{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fly{position:fixed;z-index:50;pointer-events:none;width:30px;height:30px}
.fly svg{width:100%;height:100%}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:30;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.floattxt{position:fixed;z-index:60;pointer-events:none;font-family:"Fredoka";font-weight:700;font-size:16px;color:#C78A1F;text-shadow:0 1px 0 #fff;animation:floatup .9s ease-out forwards}
.floattxt.g{color:#7E62C9}.floattxt.x{color:var(--rose-deep)}
@keyframes floatup{to{transform:translateY(-40px);opacity:0}}

/* info bar */
.infobar{display:flex;align-items:center;gap:10px;margin:6px 12px 0;background:var(--card);border-radius:16px;padding:6px 10px;box-shadow:var(--shadow);min-height:52px;flex:none;font-size:13px}
.infobar .iv{width:40px;height:40px;flex:none}
.infobar .iv svg{width:100%;height:100%}
.infobar .t{flex:1;min-width:0}
.infobar .t b{display:block;font-size:14px}
.infobar .t span{color:var(--muted);font-size:12px}
.infobar .sell{background:var(--butter);color:#8A6210;border-radius:12px;padding:8px 12px;font-weight:800;font-size:12px;display:flex;gap:4px;align-items:center;flex:none}
.infobar .sell svg{width:16px;height:16px}
.infobar .tip{color:var(--muted);flex:1;font-style:italic}
.infobar.tut{background:linear-gradient(135deg,#FFF6E5,#FFE9A8);color:#6B4E12}
.infobar.tut .t b{color:#6B4E12}

/* nav */
.nav{display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));flex:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:var(--muted);width:64px;position:relative}
.nav button .i{width:42px;height:42px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.nav button.on{color:var(--rose-deep)}
.nav button.on .i{background:linear-gradient(135deg,var(--pink),#FFD7E3)}
.nav button .dot{position:absolute;top:-2px;right:8px;width:12px;height:12px;border-radius:50%;background:var(--rose-deep);border:2px solid #fff}

/* modal */
.modal{position:absolute;inset:0;background:rgba(74,59,69,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .2s}
@media (min-width:520px){.modal{border-radius:36px}}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:88%;background:var(--card);border-radius:28px 28px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:up .3s cubic-bezier(.2,.9,.3,1.1);position:relative}
.sheet.center{border-radius:28px;max-width:360px;margin-bottom:auto;margin-top:auto;text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:22px}
.sheet .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.sheet .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:16px;color:var(--muted)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:16px;padding:12px 18px;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;box-shadow:0 4px 0 #B9506F}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #B9506F}
.btn.wide{width:100%}
.btn.soft{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.soft:active{box-shadow:0 1px 0 var(--line)}
.btn.gem{background:linear-gradient(135deg,#B59BE6,#7E62C9);box-shadow:0 4px 0 #5D45A3}
.btn.gem:active{box-shadow:0 1px 0 #5D45A3}
.btn.mint{background:linear-gradient(135deg,#9FD9BE,#6FAE84);box-shadow:0 4px 0 #4F8A63}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;padding:8px 12px;border-radius:99px;background:var(--card2);font-weight:800;font-size:12px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gi{background:var(--card2);border-radius:16px;padding:8px 6px;text-align:center;font-size:11px;font-weight:700;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.gi .pv{width:64px;height:48px;display:grid;place-items:center}
.gi .pv svg{max-width:100%;max-height:100%}
.gi .price{display:inline-flex;gap:3px;align-items:center;font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px;background:#fff}
.gi .price svg{width:13px;height:13px}
.gi.owned .price{background:var(--mint);color:#2F6B45}
.gi.eq{box-shadow:0 0 0 3px var(--rose) inset}
.gi.eq .price{background:var(--rose);color:#fff}
.gi.locked{opacity:.55}
.book{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.book .b{aspect-ratio:1;border-radius:10px;background:var(--card2);display:grid;place-items:center}
.book .b svg{width:88%;height:88%}
.book .b.unk svg{filter:grayscale(1) brightness(.3) opacity(.25)}
.chainrow{margin-bottom:12px}
.chainrow .h{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:4px}
.chainrow .h span{color:var(--muted);font-weight:700}
.daily{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.daily .d{background:var(--card2);border-radius:14px;padding:8px 4px;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.daily .d .v{font-size:13px;color:var(--ink)}
.daily .d.got{background:var(--mint);color:#2F6B45}
.daily .d.today{background:linear-gradient(135deg,var(--pink),#FFD7E3);color:var(--rose-deep);box-shadow:0 0 0 3px var(--rose) inset}
.daily .d.today .v{color:var(--rose-deep)}
.daily .d svg{width:26px;height:26px}
.friend{display:flex;gap:10px;align-items:center;padding:10px;border-radius:18px;background:var(--card2);margin-bottom:8px}
.friend .av{width:54px;height:54px;border-radius:50%;background:#fff;flex:none;overflow:hidden}
.friend .av svg{width:100%;height:100%}
.friend .t{flex:1;min-width:0}
.friend .t b{display:block;font-size:14px}
.friend .t span{font-size:12px;color:var(--muted)}
.hearts{display:flex;gap:2px;margin-top:4px;align-items:center;font-size:11px;color:var(--rose-deep);font-weight:800}
.hearts i{display:block;height:6px;flex:1;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.hearts i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--rose)}
.friend.locked{opacity:.6}
.friend .story{background:#fff;border-radius:12px;padding:6px 10px;font-size:11px;font-weight:800;color:var(--rose-deep);flex:none}
.story-card{text-align:left}
.story-card .av{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;background:var(--card2);overflow:hidden}
.story-card .av svg{width:100%;height:100%}
.story-card p{font-size:15px;line-height:1.5;background:var(--card2);border-radius:16px;padding:12px 14px;margin:0 0 12px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--card2);margin-bottom:6px;font-size:13px}
.ach .ic{width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.ach .t{flex:1}.ach .t b{display:block;font-size:13px}.ach .t span{font-size:11px;color:var(--muted)}
.ach.got{background:var(--mint)}
.ach .claim{background:var(--rose);color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:11px}
.pack{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--card2);margin-bottom:8px}
.pack .ic{font-size:26px;width:44px;text-align:center}
.pack .t{flex:1}.pack .t b{display:block}.pack .t span{font-size:11px;color:var(--muted)}
.pack .p{background:var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;font-weight:800;font-size:11px}
.toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.2);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.title{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:20px;text-align:center}
.title .hero{width:100%;max-width:400px;height:260px;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);position:relative;background:#CDE7F7}
.title .hero svg{position:absolute;inset:0;width:100%;height:100%}
.title h1{font-size:44px;margin:18px 0 0;color:var(--rose-deep);text-shadow:0 3px 0 #fff,0 6px 0 rgba(217,106,140,.2);font-weight:700}
.title .tag{color:var(--muted);margin:4px 0 20px;font-size:15px}
.title .credit{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted)}
.title .credit a{color:var(--rose-deep)}
.lvlup{font-size:56px;line-height:1;margin:6px 0}
.rewards{display:flex;justify-content:center;gap:10px;margin:10px 0 16px;flex-wrap:wrap}
.rewards span{background:var(--card2);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.rewards span svg{width:20px;height:20px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700}
.toggle{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--mint-deep)}.toggle.on::after{left:23px}
.text-in{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;text-align:center;font-weight:800;font-size:16px;margin:8px 0 12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
@media (max-height:720px){.front{height:150px}}

<body>
<div id="app">
  <div class="hud" id="hud"></div>
  <div class="front" id="front"></div>
  <div class="orders" id="orders"></div>
  <div class="boardwrap"><div class="board" id="board"><div class="cells" id="cells"></div><div id="items"></div><div id="locks"></div></div></div>
  <div class="infobar" id="infobar"></div>
  <nav class="nav" id="nav"></nav>
  <div id="modal"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="title" id="title"></div>
</div>
<script>
/* =====================================================================

   Single-file build. Edit CONFIG below.

const CONFIG = { author: "Ariya Shahid", portfolio: "", version: "1.0.0" };

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => n >= 10000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(Math.round(n));
const now = () => Date.now();
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const hourNow = () => new Date().getHours() + new Date().getMinutes() / 60;
const isNight = () => { const h = hourNow(); return h >= 20 || h < 5.5; };
function shade(hex, f){ const n = parseInt(hex.slice(1), 16); const c = s => clamp(Math.round(((n >> s) & 255) * f), 0, 255); return "#" + [16, 8, 0].map(s => c(s).toString(16).padStart(2, "0")).join(""); }
function mix(a, b, t){ const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16); const c = s => Math.round(((A >> s) & 255) * (1 - t) + ((B >> s) & 255) * t); return "#" + [16, 8, 0].map(s => c(s).toString(16).padStart(2, "0")).join(""); }

/* ---------- icons ---------- */
const ICON = {
  coin: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#F5C542"/><circle cx="12" cy="12" r="7.5" fill="#FFD966" stroke="#E0A92E" stroke-width="1.2"/><path d="M12 7.5v9M9.5 10.2c0-1.1 1.1-1.7 2.5-1.7s2.5.6 2.5 1.6c0 2.4-5 1.3-5 3.8 0 1 1.1 1.7 2.5 1.7s2.5-.6 2.5-1.6" fill="none" stroke="#C78A1F" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="9" cy="8" rx="2" ry="1" fill="#fff" opacity=".6" transform="rotate(-30 9 8)"/></svg>`,
  gem: `<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 13L2 9z" fill="#A98BD6"/><path d="M6 3h12l4 6H2z" fill="#C9B4F0"/><path d="M9 9l3 13 3-13z" fill="#8E70CF"/><path d="M6 3l3 6h6l3-6" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1"/><path d="M2 9h20" stroke="#fff" stroke-opacity=".5" stroke-width="1"/></svg>`,
  heart: `<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z" fill="#F28DAA"/><ellipse cx="8.5" cy="8.5" rx="1.6" ry="1" fill="#fff" opacity=".7" transform="rotate(-30 8.5 8.5)"/></svg>`,
  xp: `<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#F7C948"/></svg>`,
  bolt: `<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#7DBA8F"/></svg>`,
  lock: `<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3" fill="#B98F78"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#B98F78" stroke-width="2.4"/></svg>`,
  leaf: `<svg viewBox="0 0 24 24"><path d="M4 20C4 9 12 4 21 4c0 9-5 17-17 16z" fill="#7DBA8F"/><path d="M5 19C9 13 13 9 19 6" stroke="#4F8A63" stroke-width="1.4" fill="none"/></svg>`
};

/* ---------- flower chains ---------- */
const CHAINS = [
  { id: "tulip",    name: "Tulip",     kind: "tulip",   unlock: 1,  p: "#F78FB3", p2: "#E06A93", c: "#FFE08A", lf: "#7DBA8F", pot: "#E6A08A" },
  { id: "daisy",    name: "Daisy",     kind: "daisy",   unlock: 2,  p: "#FFFFFF", p2: "#EFE6F7", c: "#FFD54F", lf: "#86C29A", pot: "#C9A27E" },
  { id: "rose",     name: "Rose",      kind: "rose",    unlock: 5,  p: "#F26D85", p2: "#CF4A66", c: "#FFB3C1", lf: "#6FA97F", pot: "#D08C8C" },
  { id: "lavender", name: "Lavender",  kind: "lavender",unlock: 10, p: "#B39DDB", p2: "#8E70CF", c: "#D9CCF4", lf: "#8FBF9F", pot: "#B9A7D6" },
  { id: "peony",    name: "Peony",     kind: "peony",   unlock: 14, p: "#FFC1D3", p2: "#F28DAA", c: "#FFF0F3", lf: "#7DBA8F", pot: "#E8B4C2" },
  { id: "sunflower",name: "Sunflower", kind: "sun",     unlock: 18, p: "#FFC93C", p2: "#F0A500", c: "#6B4A3A", lf: "#7DAA6F", pot: "#D4B483" },
  { id: "moon",     name: "Moonflower",kind: "moon",    unlock: 99, p: "#E8F0FF", p2: "#B8CCF2", c: "#FFF6B3", lf: "#9DB8C9", pot: "#A9B9D6", story: true }
];
const TIER_NAMES = ["Seed", "Sprout", "Bud", "Bloom", "Pair", "Bunch", "Bouquet"];
const TIER_VALUE = [1, 3, 7, 16, 40, 95, 220];
const MAX_T = 7;
const chainById = id => CHAINS.find(c => c.id === id);

/* ---------- SVG art: flowers ---------- */
const artCache = new Map();
function pot(x, y, w, col){
  const h = w * .8, rim = w * 1.12;
  return `<path d="M${x - w / 2} ${y - h} L${x - w / 2 + w * .12} ${y} L${x + w / 2 - w * .12} ${y} L${x + w / 2} ${y - h}z" fill="${col}"/><rect x="${x - rim / 2}" y="${y - h - w * .18}" width="${rim}" height="${w * .26}" rx="${w * .08}" fill="${shade(col, 1.1)}"/><ellipse cx="${x}" cy="${y - h - w * .05}" rx="${w * .46}" ry="${w * .11}" fill="#6B4A3A"/>`;
}
function stem(x, y1, y2, lf, leaves = true){
  let s = `<path d="M${x} ${y1} Q${x + 1.5} ${(y1 + y2) / 2} ${x} ${y2}" stroke="${shade(lf, .85)}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  if (leaves){ const my = (y1 + y2) / 2 + 3; s += `<path d="M${x} ${my} q-9 -2 -9 -9 q8 0 9 9z" fill="${lf}"/><path d="M${x} ${my + 5} q9 -2 9 -9 q-8 0 -9 9z" fill="${shade(lf, .9)}"/>`; }
  return s;
}
function head(ch, cx, cy, r){
  const { kind, p, p2, c } = ch;
  let s = "";
  if (kind === "tulip"){
    s += `<path d="M${cx - r} ${cy + r * .2} q0 ${r * 1.1} ${r} ${r * 1.1} q${r} 0 ${r} ${-r * 1.1} l0 ${-r * 1.1} q${-r * .5} ${r * .5} ${-r} ${-r * .2} q${-r * .5} ${r * .7} ${-r} ${.2 * r}z" fill="${p}"/>`;
    s += `<path d="M${cx} ${cy - r * .9} q${-r * .45} ${r * .9} ${-r * .55} ${r * 1.6} q${r * .3} ${r * .6} ${r * .55} ${r * .6} q${r * .25} 0 ${r * .55} ${-r * .6} q${-r * .1} ${-r * .7} ${-r * .55} ${-r * 1.6}z" fill="${p2}" opacity=".55"/>`;
    s += `<ellipse cx="${cx - r * .45}" cy="${cy}" rx="${r * .18}" ry="${r * .5}" fill="#fff" opacity=".35"/>`;
  } else if (kind === "daisy"){
    for (let i = 0; i < 11; i++){ const a = i * 360 / 11; s += `<ellipse cx="${cx}" cy="${cy - r * .62}" rx="${r * .26}" ry="${r * .62}" fill="${i % 2 ? p2 : p}" transform="rotate(${a} ${cx} ${cy})"/>`; }
    s += `<circle cx="${cx}" cy="${cy}" r="${r * .42}" fill="${c}"/><circle cx="${cx - r * .12}" cy="${cy - r * .12}" r="${r * .14}" fill="#fff" opacity=".5"/>`;
  } else if (kind === "rose"){
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p}"/>`;
    for (let i = 0; i < 5; i++){ const a = i * 72; s += `<path d="M${cx} ${cy - r} a${r} ${r} 0 0 1 ${r * .95} ${r * .31}" fill="none" stroke="${p2}" stroke-width="${r * .14}" stroke-linecap="round" transform="rotate(${a} ${cx} ${cy})"/>`; }
    s += `<circle cx="${cx}" cy="${cy}" r="${r * .58}" fill="${shade(p, 1.08)}"/><path d="M${cx - r * .3} ${cy - r * .2} a${r * .4} ${r * .4} 0 1 1 ${r * .5} ${r * .35}" fill="none" stroke="${p2}" stroke-width="${r * .13}" stroke-linecap="round"/><circle cx="${cx + r * .05}" cy="${cy + r * .05}" r="${r * .17}" fill="${p2}"/>`;
    s += `<ellipse cx="${cx - r * .4}" cy="${cy - r * .45}" rx="${r * .22}" ry="${r * .12}" fill="#fff" opacity=".45" transform="rotate(-35 ${cx - r * .4} ${cy - r * .45})"/>`;
  } else if (kind === "lavender"){
    for (let i = 0; i < 7; i++){ const yy = cy + r * .9 - i * r * .32, w = r * (.55 - i * .04); s += `<ellipse cx="${cx - w * .55}" cy="${yy}" rx="${w * .6}" ry="${r * .22}" fill="${i % 2 ? p : p2}"/><ellipse cx="${cx + w * .55}" cy="${yy}" rx="${w * .6}" ry="${r * .22}" fill="${i % 2 ? p2 : p}"/>`; }
    s += `<ellipse cx="${cx}" cy="${cy - r * 1.25}" rx="${r * .22}" ry="${r * .28}" fill="${c}"/>`;
  } else if (kind === "peony"){
    for (let i = 0; i < 9; i++){ const a = i * 40; s += `<circle cx="${cx}" cy="${cy - r * .62}" r="${r * .42}" fill="${i % 2 ? p : p2}" transform="rotate(${a} ${cx} ${cy})"/>`; }
    for (let i = 0; i < 6; i++){ const a = i * 60 + 20; s += `<circle cx="${cx}" cy="${cy - r * .36}" r="${r * .34}" fill="${p}" transform="rotate(${a} ${cx} ${cy})"/>`; }
    s += `<circle cx="${cx}" cy="${cy}" r="${r * .3}" fill="${c}"/><circle cx="${cx}" cy="${cy}" r="${r * .12}" fill="${p2}" opacity=".7"/>`;
  } else if (kind === "sun"){
    for (let i = 0; i < 16; i++){ const a = i * 22.5; s += `<ellipse cx="${cx}" cy="${cy - r * .7}" rx="${r * .17}" ry="${r * .42}" fill="${i % 2 ? p : p2}" transform="rotate(${a} ${cx} ${cy})"/>`; }
    s += `<circle cx="${cx}" cy="${cy}" r="${r * .48}" fill="${c}"/><circle cx="${cx}" cy="${cy}" r="${r * .3}" fill="${shade(c, .8)}"/><circle cx="${cx - r * .14}" cy="${cy - r * .14}" r="${r * .07}" fill="#fff" opacity=".35"/>`;
  } else if (kind === "moon"){
    s += `<circle cx="${cx}" cy="${cy}" r="${r * 1.25}" fill="#FFF8C4" opacity=".35"/>`;
    for (let i = 0; i < 5; i++){ const a = i * 72; s += `<path d="M${cx} ${cy} q${-r * .55} ${-r * .6} 0 ${-r * 1.05} q${r * .55} ${r * .45} 0 ${r * 1.05}z" fill="${i % 2 ? p : p2}" transform="rotate(${a} ${cx} ${cy})"/>`; }
    s += `<circle cx="${cx}" cy="${cy}" r="${r * .26}" fill="${c}"/>`;
  }
  return s;
}
function sparkles(n, seed = 1){
  let s = ""; for (let i = 0; i < n; i++){ const x = 8 + ((seed * 37 + i * 53) % 48), y = 6 + ((seed * 19 + i * 31) % 40), r = 1.6 + (i % 3) * .5; s += `<path d="M${x} ${y - r * 2} q${r * .3} ${r * 1.7} ${r * 2} ${r * 2} q${-r * 1.7} ${r * .3} ${-r * 2} ${r * 2} q${-r * .3} ${-r * 1.7} ${-r * 2} ${-r * 2} q${r * 1.7} ${-r * .3} ${r * 2} ${-r * 2}z" fill="#fff" opacity=".9"/>`; } return s;
}
function flowerSVG(chainId, t){
  const key = chainId + ":" + t;
  if (artCache.has(key)) return artCache.get(key);
  const ch = chainById(chainId);
  let s = "";
  if (t === 1){ s = pot(32, 56, 24, ch.pot) + `<ellipse cx="32" cy="34" rx="6" ry="8" fill="#8B5E3C" transform="rotate(-15 32 34)"/><ellipse cx="30" cy="31" rx="2" ry="3" fill="#B98F78" transform="rotate(-15 30 31)"/><path d="M40 20 q1 4 5 5 q-4 1 -5 5 q-1-4-5-5 q4-1 5-5z" fill="${ch.p}" opacity=".9"/>`; }
  else if (t === 2){ s = pot(32, 58, 24, ch.pot) + stem(32, 28, 40, ch.lf, false) + `<path d="M32 36 q-12 -1 -13 -12 q11 1 13 12z" fill="${ch.lf}"/><path d="M32 36 q12 -1 13 -12 q-11 1 -13 12z" fill="${shade(ch.lf, .9)}"/><circle cx="32" cy="22" r="4" fill="${shade(ch.lf, 1.12)}"/>`; }
  else if (t === 3){ s = pot(32, 60, 22, ch.pot) + stem(32, 24, 42, ch.lf) + `<ellipse cx="32" cy="20" rx="8" ry="11" fill="${ch.p}"/><path d="M32 9 q6 5 5 16 q-3 -3 -5 -16z" fill="${ch.p2}" opacity=".6"/><path d="M26 24 q-3 -8 6 -14" fill="none" stroke="${ch.lf}" stroke-width="2.2" stroke-linecap="round"/><path d="M38 24 q3 -8 -6 -14" fill="none" stroke="${ch.lf}" stroke-width="2.2" stroke-linecap="round"/>`; }
  else if (t === 4){ s = stem(32, 28, 60, ch.lf) + head(ch, 32, 22, 13); }
  else if (t === 5){ s = stem(24, 30, 60, ch.lf) + stem(40, 32, 60, ch.lf) + head(ch, 23, 22, 11) + head(ch, 41, 25, 11); }
  else if (t === 6){ s = stem(20, 32, 58, ch.lf, false) + stem(32, 26, 58, ch.lf) + stem(44, 32, 58, ch.lf, false) + head(ch, 19, 24, 10) + head(ch, 45, 24, 10) + head(ch, 32, 17, 11) + `<path d="M26 50 q6 -4 12 0 q-6 4 -12 0z" fill="#F28DAA"/><circle cx="32" cy="50" r="2.4" fill="#D96A8C"/>`; }
  else { s = `<path d="M18 30 L46 30 L38 62 L26 62z" fill="#FFF1F5"/><path d="M18 30 L46 30 L32 44z" fill="#F9C5D5"/><path d="M22 30 L42 30 L32 40z" fill="#FFF8FA"/>` + head(ch, 20, 22, 9) + head(ch, 44, 22, 9) + head(ch, 32, 12, 9) + head(ch, 26, 30, 8) + head(ch, 38, 30, 8) + `<path d="M24 46 q8 -5 16 0 q-8 5 -16 0z" fill="#F28DAA"/><circle cx="32" cy="46" r="2.6" fill="#D96A8C"/>` + sparkles(3, 7); }
  const out = `<svg viewBox="0 0 64 64" aria-hidden="true">${s}</svg>`;
  artCache.set(key, out); return out;
}
/* special items */
function planterSVG(t){
  const cols = ["#E6A08A", "#B9A7D6", "#D9B45A"][t - 1];
  return `<svg viewBox="0 0 64 64"><path d="M12 24h40l-5 32H17z" fill="${cols}"/><rect x="8" y="18" width="48" height="9" rx="3" fill="${shade(cols, 1.12)}"/><ellipse cx="32" cy="22" rx="20" ry="3" fill="#6B4A3A"/>${t >= 2 ? `<path d="M20 44 q2 -8 12 -8 q10 0 12 8z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>` : ""}${t >= 3 ? `<path d="M32 34 l2 5 5 0 -4 3 1.5 5 -4.5 -3 -4.5 3 1.5 -5 -4 -3 5 0z" fill="#fff" opacity=".8"/>` : ""}<path d="M26 14 q6 -8 12 0" fill="none" stroke="#7DBA8F" stroke-width="3" stroke-linecap="round"/><path d="M32 10 q-6 0 -7 7 q7 0 7 -7z" fill="#7DBA8F"/><path d="M32 10 q6 0 7 7 q-7 0 -7 -7z" fill="#6FAE84"/></svg>`;
}
const WRAP_ART = [
  `<svg viewBox="0 0 64 64"><path d="M14 36 q18 -14 36 0 q-18 14 -36 0z" fill="#F28DAA"/><path d="M14 36 q10 -4 18 0 q8 4 18 0" fill="none" stroke="#D96A8C" stroke-width="2"/><circle cx="32" cy="36" r="5" fill="#D96A8C"/><path d="M28 40 l-6 10 M36 40 l6 10" stroke="#F28DAA" stroke-width="4" stroke-linecap="round"/></svg>`,
  `<svg viewBox="0 0 64 64"><path d="M12 18 h40 v30 q-20 8 -40 0z" fill="#FFF1F5"/><path d="M12 18 h40 v6 h-40z" fill="#F9C5D5"/><circle cx="24" cy="34" r="3" fill="#F9C5D5"/><circle cx="40" cy="38" r="3" fill="#F9C5D5"/><circle cx="32" cy="28" r="2" fill="#F9C5D5"/></svg>`,
  `<svg viewBox="0 0 64 64"><rect x="12" y="20" width="40" height="34" rx="6" fill="#FFF1F5"/><rect x="12" y="20" width="40" height="34" rx="6" fill="none" stroke="#F9C5D5" stroke-width="2"/><rect x="29" y="20" width="6" height="34" fill="#F28DAA"/><rect x="12" y="34" width="40" height="6" fill="#F28DAA"/><path d="M32 20 q-8 -12 -12 -4 q-2 5 12 4z M32 20 q8 -12 12 -4 q2 5 -12 4z" fill="#D96A8C"/>${sparkles(2, 3)}</svg>`
];
const WRAP_NAMES = ["Ribbon", "Tissue paper", "Gift box"];
const COIN_ITEM = `<svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="20" fill="#F5C542"/><circle cx="32" cy="34" r="15" fill="#FFD966" stroke="#E0A92E" stroke-width="2"/><text x="32" y="41" text-anchor="middle" font-family="Fredoka,Nunito,sans-serif" font-weight="700" font-size="20" fill="#C78A1F">$</text><ellipse cx="24" cy="24" rx="4" ry="2" fill="#fff" opacity=".7" transform="rotate(-30 24 24)"/></svg>`;
const GEM_ITEM = `<svg viewBox="0 0 64 64"><path d="M18 14h28l10 14-24 28L8 28z" fill="#A98BD6"/><path d="M18 14h28l10 14H8z" fill="#C9B4F0"/><path d="M24 28l8 28 8-28z" fill="#8E70CF"/><path d="M8 28h48" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>${sparkles(2, 5)}</svg>`;
function itemSVG(it){
  if (it.c === "planter") return planterSVG(it.t);
  if (it.c === "wrap") return WRAP_ART[it.t - 1];
  if (it.c === "coin") return COIN_ITEM;
  if (it.c === "gem") return GEM_ITEM;
  return flowerSVG(it.c, it.t);
}
function itemName(it){
  if (it.c === "planter") return ["Clay planter", "Lilac planter", "Golden planter"][it.t - 1];
  if (it.c === "wrap") return WRAP_NAMES[it.t - 1];
  if (it.c === "coin") return "Coin pouch";
  if (it.c === "gem") return "Gem bud";
  return `${chainById(it.c).name} ${TIER_NAMES[it.t - 1]}`;
}
function itemValue(it){
  if (it.c === "wrap") return [6, 18, 50][it.t - 1];
  if (it.c === "planter" || it.c === "coin" || it.c === "gem") return 0;

/* ---------- planters / offline ---------- */
function regenPlanters(){
  const t = now(); let changed = false;
  G.board.forEach(it => {
    if (!it || it.c !== "planter") return;
    const max = planterMax(it.t), ms = planterRegen(it.t);
    if (it.ch >= max){ it.ts = t; return; }
    while (it.ch < max && t - it.ts >= ms){ it.ch++; it.ts += ms; changed = true; }
    if (it.ch >= max) it.ts = t;
  });
  return changed;
}

function genOrder(id){
  const night = isNight();
  let pool = NEIGHBORS.filter(n => n.unlock <= G.level && (!n.night || night));
  const used = G.orders.filter(Boolean).map(o => o.who);
  const fresh = pool.filter(n => !used.includes(n.id)); if (fresh.length) pool = fresh;
  if (night && pool.some(n => n.night) && Math.random() < .45) pool = pool.filter(n => n.night);
  const who = pick(pool);
  const chains = unlockedChains().filter(c => c.id !== "moon" || who.id === "luna" || Math.random() < .3);
  const hi = clamp(2 + Math.floor(G.level * .45), 3, 7), lo = Math.max(2, hi - 2);
  const needs = [];
  const count = G.level >= 4 && Math.random() < .45 ? 2 : 1;
  for (let i = 0; i < count; i++){
    let c = (Math.random() < .5 ? pick(who.likes.filter(l => chains.some(x => x.id === l))) : null) || pick(chains).id;
    let t = ri(lo, hi); if (t >= 6 && Math.random() < .5) t--;
    if (needs.some(n => n.c === c)) { t = clamp(t + 1, 2, 7); }
    const taken = G.orders.filter(Boolean).flatMap(o => o.needs).some(nd => nd.c === c && nd.t === t);
    if (taken) t = t > lo ? t - 1 : Math.min(hi, t + 1);
    const n = t <= 3 && G.level >= 3 && Math.random() < .3 ? 2 : 1;
    if (!needs.some(n2 => n2.c === c && n2.t === t)) needs.push({ c, t, n });
  }
  if (G.level >= 7 && Math.random() < .3) needs.push({ c: "wrap", t: ri(1, G.level >= 12 ? 3 : 2), n: 1 });
  let coins = 0, xp = 0, maxT = 0;
  needs.forEach(nd => { const v = nd.c === "wrap" ? [6, 18, 50][nd.t - 1] : TIER_VALUE[nd.t - 1]; coins += v * 5.5 * nd.n; xp += (nd.c === "wrap" ? 6 : nd.t * 5) * nd.n; maxT = Math.max(maxT, nd.c === "wrap" ? 0 : nd.t); });
  coins = Math.max(20, Math.round(coins / 5) * 5);
  const gems = who.night ? 2 : (maxT >= 6 && Math.random() < .45 ? 1 : 0);
  return { id: id || ++orderSeq, who: who.id, needs, coins, xp, gems, ts: now() };
}

/* ---------- board actions ---------- */
function spawnFromPlanter(i, el){
  const it = G.board[i]; regenPlanters();
  if (it.ch <= 0){ sfx.err(); openRefill(i); return false; }
  const empties = emptyCells();
  if (!empties.length){ toast("The board is full. Merge or sell something!"); sfx.err(); return false; }
  const r0 = rowOf(i), c0 = colOf(i);
  empties.sort((a, b) => (Math.abs(rowOf(a) - r0) + Math.abs(colOf(a) - c0) + Math.random() * .5) - (Math.abs(rowOf(b) - r0) + Math.abs(colOf(b) - c0) + Math.random() * .5));
  const target = empties[0];
  let chains = unlockedChains().filter(c => c.id !== "moon" || Math.random() < .35);
  const wanted = G.orders.filter(Boolean).flatMap(o => o.needs.filter(n => n.c !== "wrap").map(n => n.c));
  let c = (Math.random() < .55 && wanted.length) ? pick(wanted) : pick(chains).id;
  if (!chains.some(x => x.id === c)) c = pick(chains).id;
  let t = 1; const r = Math.random();
  if (it.t === 3 && r < .18) t = 3; else if (it.t >= 2 && r < .22) t = 2; else if (r < .06) t = 2;
  if (it.t === 3 && Math.random() < .06){ G.board[target] = { c: "wrap", t: 1 }; } else G.board[target] = { c, t };
  it.ch--; if (it.ch === planterMax(it.t) - 1) it.ts = now();
  G.seen[c] = Math.max(G.seen[c] || 0, t);
  flyItem(i, target, G.board[target]);
  sfx.spawn(); haptic(8);
  if (G.tut === 1) G.tut = 2;
  save(); return true;
}
function tryMerge(from, to){
  const a = G.board[from], b = G.board[to];
  if (!a || !b || a.c !== b.c || a.t !== b.t) return false;
  if (a.c === "coin" || a.c === "gem") return false;
  const max = a.c === "planter" || a.c === "wrap" ? 3 : MAX_T;
  if (a.t >= max) return false;
  const nt = a.t + 1;
  let res;
  if (a.c === "planter") res = { c: "planter", t: nt, ch: Math.min(a.ch + b.ch + 2, planterMax(nt)), ts: now() };
  else res = { c: a.c, t: nt };
  G.board[to] = res; G.board[from] = null;
  G.stats.merges++;
  if (a.c !== "planter" && a.c !== "wrap"){
    G.seen[a.c] = Math.max(G.seen[a.c] || 0, nt);
    addXP(Math.max(1, Math.round(nt * 1.2)));
    if (nt === MAX_T){ G.stats.bouquets++; }
    // bonus drops
    const empties = emptyCells();
    if (empties.length){
      const r = Math.random();
      if (nt >= 3 && r < .07 && G.level >= 5) G.board[pick(empties)] = { c: "wrap", t: 1 };
      else if (r < .11) G.board[pick(empties)] = { c: "coin", t: 1, v: ri(12, 30) + G.level * 4 };
      else if (r < .13 && nt >= 4) G.board[pick(empties)] = { c: "gem", t: 1 };
    }
  }
  if (G.tut === 2) G.tut = 3;
  if (G.tut === 3 && countItems("tulip", 3) > 0) G.tut = 4;
  sfx.merge(nt); haptic(14);
  checkAchievements(); checkCollection();
  save(); return true;
}

  if (it.c === "coin"){ addCoins(it.v || 20, at); sfx.coin(); }

}

function deliver(k){
  const o = G.orders[k]; if (!o || !canDeliver(o)) return;
  const card = $$(".order")[k];
  o.needs.forEach(nd => { let n = nd.n; for (let i = 0; i < G.board.length && n > 0; i++){ const it = G.board[i]; if (it && it.c === nd.c && it.t === nd.t){ const el = itemEl(i); if (el && card) flyTo(el, card, itemSVG(it)); G.board[i] = null; n--; } } });
  const at = card ? centerOf(card) : null;
  addCoins(o.coins, at); if (o.gems) setTimeout(() => addGems(o.gems, at), 250);
  addXP(o.xp);
  const who = neighborById(o.who);
  addHearts(o.who, 1 + (o.needs.some(nd => nd.t >= 5 && nd.c !== "wrap") ? 1 : 0));

}

  if (d.slot === "wall") return `<svg viewBox="0 0 60 40"><rect width="60" height="40" rx="8" fill="${WALLS[d.id]}" stroke="${shade(WALLS[d.id], .9)}" stroke-width="2"/></svg>`;
  if (d.slot === "door") return `<svg viewBox="0 0 40 48"><rect x="4" y="2" width="32" height="44" rx="5" fill="${DOORS[d.id]}"/><rect x="10" y="8" width="20" height="14" rx="3" fill="#CDE7F7"/><circle cx="30" cy="32" r="2.5" fill="#FFE9A8"/></svg>`;
  if (d.slot === "sign"){ const bg = d.id === "neon" ? "#3B3160" : d.id === "gold" ? "#F2D27E" : "#C9A27E", fg = d.id === "neon" ? "#FF8FB8" : d.id === "gold" ? "#8A6210" : "#FFF8F1"; return `<svg viewBox="0 0 64 30"><rect x="2" y="5" width="60" height="20" rx="6" fill="${bg}"/><text x="32" y="19" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="9" fill="${fg}">BLOOM</text></svg>`; }
  if (d.slot === "window") return { plain: "🪟", box: "🌸", lights: "✨", lanterns: "🏮" }[d.id] ? `<span style="font-size:26px">${{ plain: "🪟", box: "🌸", lights: "✨", lanterns: "🏮" }[d.id]}</span>` : "";
  if (d.slot === "ground") return `<span style="font-size:26px">${{ plain: "🧱", checker: "🏁", petals: "🌸" }[d.id]}</span>`;
  return "";
}
function openBook(){
  openModal(`<h2>Flower book</h2><p class="sub">Every stage you've grown. Complete a row for 10 gems.</p>
    ${CHAINS.filter(c => c.unlock <= G.level || c.id !== "moon" || G.moon).map(c => { const seen = G.seen[c.id] || 0; const locked = c.unlock > G.level && !(c.id === "moon" && G.moon);
      return `<div class="chainrow"><div class="h"><span style="color:var(--ink)">${c.name}${locked ? " 🔒" : ""}</span><span>${locked ? (c.id === "moon" ? "Luna's story" : `Level ${c.unlock}`) : seen >= MAX_T ? "Complete ✓" : `${seen}/${MAX_T}`}</span></div><div class="book">${Array.from({ length: MAX_T }, (_, i) => `<div class="b${i < seen ? "" : " unk"}" title="${TIER_NAMES[i]}">${flowerSVG(c.id, i + 1)}</div>`).join("")}</div></div>`; }).join("")}`);
}
let friendsTab = "friends";
function openFriends(tab){
  friendsTab = tab || friendsTab;
  let body = "";
  if (friendsTab === "friends") body = NEIGHBORS.map(n => { const locked = n.unlock > G.level; const h = G.hearts[n.id] || 0; const seen = G.storySeen[n.id] || 0; const next = HEART_STEPS[seen];
      return `<div class="friend${locked ? " locked" : ""}"><div class="av">${critterSVG(n.sp, { mood: locked ? "sleepy" : "dot" })}</div><div class="t"><b>${locked ? "???" : n.name}</b><span>${locked ? `Moves in at level ${n.unlock}` : n.role + (n.night ? " · visits after 8pm" : "")}</span>
        ${locked ? "" : `<div class="hearts">${ICON.heart.replace("<svg", '<svg style="width:12px;height:12px"')} ${h}${next ? `<i style="--p:${clamp(h / next * 100, 0, 100)}%"></i><span style="color:var(--muted)">${next}</span>` : `<span>· Best friends</span>`}</div>`}</div>
        ${!locked && seen ? `<button class="story" data-act="replay" data-id="${n.id}">${seen} ${seen > 1 ? "stories" : "story"}</button>` : ""}</div>`; }).join("");
  else body = ACHIEVEMENTS.map(a => `<div class="ach${G.ach[a.id] === true ? " got" : ""}"><div class="ic">${a.icon}</div><div class="t"><b>${a.name}</b><span>${a.desc}</span></div>${G.ach[a.id] === "ready" ? `<button class="claim" data-act="claim" data-id="${a.id}">Claim ${a.gems} 💎</button>` : G.ach[a.id] === true ? `<span style="font-size:12px;font-weight:800;color:#2F6B45">✓</span>` : `<span style="font-size:11px;font-weight:800;color:var(--muted)">${a.gems} 💎</span>`}</div>`).join("");
  openModal(`<h2>Neighbors</h2><p class="sub">Fill orders to earn hearts. Hearts unlock their stories (and gifts).</p>
    <div class="tabs"><button class="${friendsTab === "friends" ? "on" : ""}" data-act="ftab" data-t="friends">Friends</button><button class="${friendsTab === "ach" ? "on" : ""}" data-act="ftab" data-t="ach">Achievements${Object.values(G.ach).includes("ready") ? " •" : ""}</button></div>${body}`);
}
function openStore(){
  openModal(`<h2>Gem shop</h2><p class="sub">Gems speed things up and unlock premium decor. Earn them free by leveling up, daily visits, achievements and Luna's night orders.</p>
    <div class="pack"><div class="ic">💎</div><div class="t"><b>Handful of gems</b><span>40 gems</span></div><button class="p" data-act="soon">$1.99 · soon</button></div>
    <div class="pack"><div class="ic">👛</div><div class="t"><b>Pouch of gems</b><span>120 gems + Golden planter</span></div><button class="p" data-act="soon">$4.99 · soon</button></div>
    <div class="pack"><div class="ic">🧺</div><div class="t"><b>Basket of gems</b><span>300 gems + exclusive Midnight awning</span></div><button class="p" data-act="soon">$9.99 · soon</button></div>
    <div class="pack"><div class="ic">🌸</div><div class="t"><b>Bloom Pass</b><span>Monthly: daily gems, no waiting on planters, seasonal decor</span></div><button class="p" data-act="soon">$3.99/mo · soon</button></div>
    <p class="sub" style="margin-top:10px">Purchases aren't live yet in this preview build.</p>`);
}
function openMore(){
  openModal(`<h2>More</h2><p class="sub">${esc(G.shop)} · Level ${G.level} · ${G.stats.orders} orders filled</p>
    <div class="setrow"><span>Sound</span><button class="toggle${G.settings.sound ? " on" : ""}" data-act="tog" data-k="sound" aria-label="Sound"></button></div>
    <div class="setrow"><span>Vibration</span><button class="toggle${G.settings.haptics ? " on" : ""}" data-act="tog" data-k="haptics" aria-label="Vibration"></button></div>
    <div class="setrow"><span>Shop name</span><button class="btn soft" style="padding:8px 12px" data-act="rename">Rename</button></div>
    <div class="setrow"><span>Install as app</span><span style="font-size:12px;color:var(--muted);text-align:right">Share → Add to Home Screen</span></div>
    <div class="setrow" style="border:0"><span>Start over</span><button class="btn soft" style="padding:8px 12px;color:#B9506F" data-act="reset">Reset game</button></div>
    <p class="sub" style="text-align:center;margin-top:14px">Bloom & Co. v${CONFIG.version} · a cozy game by ${esc(CONFIG.author)}${CONFIG.portfolio ? ` · <a href="${esc(CONFIG.portfolio)}" target="_blank" rel="noopener" style="color:var(--rose-deep)">Portfolio</a>` : ""}</p>`);
}
function modalRename(){ openModal(`<h2>Name your shop</h2><p class="sub">It goes on the sign out front.</p><input class="text-in" id="shopname" maxlength="18" value="${esc(G.shop)}" aria-label="Shop name"><button class="btn wide" data-act="savename">Hang the sign</button>`, true); setTimeout(() => $("#shopname") && $("#shopname").focus(), 50); }

/* ---------- title ---------- */
function renderTitle(){
  const saved = store.get(SAVE_KEY);
  $("#title").innerHTML = `<div class="hero">${storefrontSVG({ awning: "pink", wall: "cream", door: "rose", sign: "wood", window: "box", ground: "plain", pet: "cat", outfit: { head: "bow" } }, { name: saved ? saved.shop : "Bloom & Co.", display: ["tulip", "daisy", "rose"], customer: "duck" })}</div>
    <h1>Bloom &amp; Co.</h1><p class="tag">Merge flowers. Fill orders. Make a street fall in love with your shop.</p>
    <div class="row" style="justify-content:center;flex-wrap:wrap">${saved ? `<button class="btn" data-act="continue">▶ Continue</button><button class="btn soft" data-act="newgame">New shop</button>` : `<button class="btn" data-act="newgame">▶ Open the shop</button>`}</div>
    <p class="credit">A cozy game by ${esc(CONFIG.author)}${CONFIG.portfolio ? ` · <a href="${esc(CONFIG.portfolio)}" target="_blank" rel="noopener">Portfolio</a>` : ""}</p>`;
  $("#title").hidden = false;
}
function startGame(){ $("#title").hidden = true; renderNav(); renderAll(); regenPlanters(); offlineReport(); checkDaily(); checkAchievements(); showNextModal(); }

/* ---------- interaction ---------- */
let confirmSell = -1, confirmT = 0;
let drag = null;
function cellFromPoint(x, y){ const r = $("#cells").getBoundingClientRect(); if (x < r.left || y < r.top || x > r.right || y > r.bottom) return -1; const c = Math.floor((x - r.left) / (r.width / COLS)), rr = Math.floor((y - r.top) / (r.height / ROWS)); const i = idx(clamp(rr, 0, ROWS - 1), clamp(c, 0, COLS - 1)); return unlocked(i) ? i : -1; }
function onDown(e){
  const el = e.target.closest(".item"); if (!el || modalOpen) return;
  const i = +el.dataset.i; if (!G.board[i]) return;
  drag = { i, el, x0: e.clientX, y0: e.clientY, moved: false, over: -1 };
  el.setPointerCapture && el.setPointerCapture(e.pointerId);
  e.preventDefault();
}
function onMove(e){
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx, dy) > 6){ drag.moved = true; drag.el.classList.add("drag"); }
  if (!drag.moved) return;
  drag.el.style.transform = `translate(${dx}px,${dy}px)`;
  const over = cellFromPoint(e.clientX, e.clientY);
  if (over !== drag.over){ $$(".cell.target").forEach(c => c.classList.remove("target")); drag.over = over; if (over >= 0 && over !== drag.i){ const b = G.board[over], a = G.board[drag.i]; if (b && a.c === b.c && a.t === b.t && !["coin", "gem"].includes(a.c) && a.t < (a.c === "planter" || a.c === "wrap" ? 3 : MAX_T)) $(`.cell[data-i="${over}"]`).classList.add("target"); } }
}
function onUp(e){
  if (!drag) return; const d = drag; drag = null;
  d.el.classList.remove("drag"); d.el.style.transform = ""; $$(".cell.target").forEach(c => c.classList.remove("target"));
  if (!d.moved){ tapItem(d.i); return; }
  const to = cellFromPoint(e.clientX, e.clientY);
  if (to < 0 || to === d.i){ renderBoard(); return; }
  const a = G.board[d.i], b = G.board[to];
  if (!b){ G.board[to] = a; G.board[d.i] = null; selected = -1; sfx.pop(); }
  else if (tryMerge(d.i, to)){ selected = to; renderBoard(); const el = itemEl(to); if (el){ el.classList.add("merged"); sparks(el); } renderHUD(); renderFront(); renderOrders(); renderInfobar(); save(); return; }
  else { G.board[to] = a; G.board[d.i] = b; sfx.pop(); }
  save(); renderBoard(); renderOrders(); renderInfobar();
}
function tapItem(i){
  const it = G.board[i]; if (!it) return;
  if (it.c === "coin" || it.c === "gem"){ selected = -1; collect(i); renderHUD(); renderBoard(); renderInfobar(); return; }
  if (it.c === "planter"){ selected = i; if (spawnFromPlanter(i)){ renderBoard(); renderOrders(); renderFront(); } renderInfobar(); return; }
  selected = selected === i ? -1 : i; confirmSell = -1; sfx.pop(); renderBoard(); renderInfobar();
}
document.addEventListener("pointerdown", onDown, { passive: false });
document.addEventListener("pointermove", onMove);
document.addEventListener("pointerup", onUp);
document.addEventListener("pointercancel", onUp);

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-nav]"); if (!b) return;
  if (b.dataset.nav){ const k = b.dataset.nav; $$(".nav button").forEach(x => x.classList.toggle("on", x === b)); if (k === "board"){ closeModal(); } else if (k === "decor") openDecor(); else if (k === "book") openBook(); else if (k === "friends") openFriends(); else if (k === "more") openMore(); sfx.pop(); return; }
  const a = b.dataset.act;
  if (a === "close-bg"){ if (e.target === b) closeModal(); return; }
  if (a === "close") closeModal();
  else if (a === "newgame"){ if (store.get(SAVE_KEY) && !confirm("Start a brand new shop? Your current one will be lost.")) return; G = null; newGame("Bloom & Co."); $("#title").hidden = true; renderNav(); renderAll(); modalRename(); }
  else if (a === "continue"){ G = store.get(SAVE_KEY); if (!G){ renderTitle(); return; } G.orders = G.orders.map(o => o || genOrder()); startGame(); }
  else if (a === "savename"){ const v = ($("#shopname").value || "").trim(); if (v) G.shop = v; save(); closeModal(); renderFront(); }
  else if (a === "rename") modalRename();
  else if (a === "deliver") deliver(+b.dataset.k);
  else if (a === "skip") skipOrder(+b.dataset.k);
  else if (a === "sell"){ const i = +b.dataset.i; if (confirmSell === i && now() - confirmT < 3000){ confirmSell = -1; sellItem(i); selected = -1; renderHUD(); renderBoard(); renderOrders(); renderInfobar(); } else { confirmSell = i; confirmT = now(); renderInfobar(); } }
  else if (a === "refill") refillPlanter(+b.dataset.i);
  else if (a === "row") unlockRow(+b.dataset.r);
  else if (a === "store") openStore();
  else if (a === "soon") toast("Coming soon! Gems are free from levels, streaks and friends for now.");
  else if (a === "dtab") openDecor(b.dataset.s);
  else if (a === "buy"){ const d = DECOR.find(x => decorKey(x) === b.dataset.k); if (d) buyDecor(d); }
  else if (a === "ftab") openFriends(b.dataset.t);
  else if (a === "claim") claimAch(b.dataset.id);
  else if (a === "replay"){ const n = neighborById(b.dataset.id); const seen = G.storySeen[n.id] || 0; openModal(`<div class="story-card"><div class="av">${critterSVG(n.sp, { mood: "happy" })}</div><h2 style="text-align:center">${n.name}</h2>${n.story.slice(0, seen).map(s => `<p>“${esc(s)}”</p>`).join("")}<button class="btn wide" data-act="close">Close</button></div>`, true); }
  else if (a === "tog"){ G.settings[b.dataset.k] = !G.settings[b.dataset.k]; save(); openMore(); if (G.settings.sound) sfx.pop(); }
  else if (a === "reset"){ if (confirm("Reset everything? This can't be undone.")){ store.del(SAVE_KEY); location.reload(); } }
  else if (a === "tutdone"){ G.tut = 9; save(); renderAll(); }
});
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- loop ---------- */
setInterval(() => {
  if (!G || $("#title").hidden === false) return;
  if (regenPlanters()){ renderBoard(); }
  if (selected >= 0 && G.board[selected] && G.board[selected].c === "planter") renderInfobar();
  if (G.tut === 3 && countItems("tulip", 3) > 0){ G.tut = 4; renderFront(); renderInfobar(); }
  if (G.tut >= 5 && G.tut < 9 && G.stats.orders >= 2){ G.tut = 9; renderAll(); }
}, 1000);
setInterval(() => { if (G && $("#title").hidden) { renderFront(); if (selected < 0) renderInfobar(); } }, 60000);
window.addEventListener("resize", () => { if (G) renderBoard(); });
if (window.ResizeObserver) new ResizeObserver(() => { if (G && $("#title").hidden) renderBoard(); }).observe($(".boardwrap"));
document.addEventListener("visibilitychange", () => { if (document.hidden && G) { G.lastSeen = now(); store.set(SAVE_KEY, G); } else if (G && $("#title").hidden){ regenPlanters(); renderBoard(); } });
window.addEventListener("beforeunload", () => { if (G){ G.lastSeen = now(); store.set(SAVE_KEY, G); } });

renderTitle();
</script>
</body>
</html>
